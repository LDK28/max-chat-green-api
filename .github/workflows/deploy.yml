name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Quality checks
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Configure S3 credentials
        env:
          ACCESS_KEY: ${{ secrets.YC_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          test -n "$ACCESS_KEY" && test -n "$SECRET_KEY"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=ru-central1" >> "$GITHUB_ENV"

      - name: Deploy assets
        env:
          BUCKET: ${{ vars.YC_BUCKET }}
        run: |
          test -n "$BUCKET"
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync dist/ "s3://$BUCKET/" --delete --exclude "index.html" --cache-control "public,max-age=31536000,immutable"

      - name: Deploy HTML
        env:
          BUCKET: ${{ vars.YC_BUCKET }}
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
